services:
  postgres:
    image: postgres:16-alpine
    container_name: church-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: church_admin
      POSTGRES_PASSWORD: church_pass_2024
      POSTGRES_DB: church_management_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church_admin -d church_management_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: church-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://church_admin:church_pass_2024@postgres:5432/church_management_db
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: church-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: